<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novasearch - Bildsök</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            color: #202124;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #dfe1e5;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #1a73e8;
            text-decoration: none;
        }
        .brand-logo span {
            color: #ea4335;
        }
        .search-box-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 44px;
            padding: 0 45px 0 45px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
        }
        .icon-search {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            fill: #9aa0a6;
            width: 18px;
            height: 18px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-right a {
            text-decoration: none;
            color: #5f6368;
            font-size: 14px;
        }
        .login-btn {
            background-color: #1a73e8;
            color: #ffffff !important;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 500;
        }
        main {
            flex: 1;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .image-card {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #70757a;
            font-size: 14px;
        }
        footer {
            background-color: #f2f2f2;
            color: #70757a;
            font-size: 14px;
            padding: 12px 24px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="brand-logo">Nova<span>search</span></a>
            <div class="search-box-container">
                <svg class="icon-search" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="imageSearchInput" class="search-input" placeholder="Sök efter bilder...">
            </div>
        </div>
        <div class="header-right">
            <a href="index.html" id="navHem">Hem</a>
            <a href="login.html" class="login-btn" id="navLogin">Logga in</a>
        </div>
    </header>

    <main>
        <h2 id="resultsHeader" style="font-size: 18px; color: #5f6368; margin-bottom: 10px;">Bildresultat</h2>
        <div class="image-grid">
            <div class="image-card">Bildexempel 1</div>
            <div class="image-card">Bildexempel 2</div>
            <div class="image-card">Bildexempel 3</div>
            <div class="image-card">Bildexempel 4</div>
        </div>
    </main>

    <footer>
        <div class="footer-location">Sverige</div>
    </footer>

    <script>
        // Enkel språkanpassning för bildsidan
        async function detectLanguageForImages() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                const countryCode = data.country_code;
                
                if (countryCode === 'ES') {
                    document.getElementById('imageSearchInput').placeholder = "Buscar imágenes...";
                    document.getElementById('navHem').innerText = "Inicio";
                    document.getElementById('navLogin').innerText = "Iniciar sesión";
                    document.getElementById('resultsHeader').innerText = "Resultados de imágenes";
                } else if (countryCode === 'SE') {
                    document.getElementById('imageSearchInput').placeholder = "Sök efter bilder...";
                    document.getElementById('navHem').innerText = "Hem";
                    document.getElementById('navLogin').innerText = "Logga in";
                    document.getElementById('resultsHeader').innerText = "Bildresultat";
                }
            } catch (e) {
                console.log("Kunde inte hämta språk");
            }
        }
        window.addEventListener('DOMContentLoaded', detectLanguageForImages);
    </script>
</body>
</html>
